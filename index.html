<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dona Anche Tu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Area Logo in alto a sinistra -->
  
  
  <!-- Container della barra di ricerca -->
  <div class="search-container">
    <!-- Pulsante in alto a destra -->
    <button class="donation-button top-right">Dona Anche Tu</button>
    
    <!-- L'immagine sopra la barra di ricerca -->
    <div class="banner-image">
      <!-- Inserisci qui l'immagine che preferisci -->
      <img src="ignat.png" alt="Banner" class="banner">
    </div>
    
    <!-- Barra di ricerca -->
    <input type="text" placeholder="Cerca..." class="search-input">
    
    <!-- Testo esplicativo sotto la barra -->
    <div class="search-text">
       Dona anche tu, per una vita in più e il numero <strong>+39 333 341 1879</strong>
    </div>
    
    <!-- Un ulteriore pulsante (es. sotto la barra) -->
    <button class="donation-button bottom-button">Dona Anche Tu</button>
  </div>
  
  <!-- Sezione galleria -->
  <div class="gallery">
    <h2>Galleria</h2>
    <div class="gallery-items">
      <!-- Inserisci almeno 10 immagini; qui sono usati dei placeholder -->
      <img src="ignat.png" alt="Immagine 1">
      <img src="ignat.png" alt="Immagine 2">
      <img src="amin.jpg" alt="Immagine 3">
      <img src="angelo.png" alt="Immagine 4">
      <img src="image5.jpg" alt="Immagine 5">
      <img src="image6.jpg" alt="Immagine 6">
      <img src="image7.jpg" alt="Immagine 7">
      <img src="image8.jpg" alt="Immagine 8">
      <img src="image9.jpg" alt="Immagine 9">
      <img src="image10.jpg" alt="Immagine 10">
    </div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
